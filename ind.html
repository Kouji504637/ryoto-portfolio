<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NeoPortfolio | 渡邉</title>
  <meta name="description" content="デザインと車が大好きなクリエイター。作品紹介・オリジナルキャラクター・受賞歴" />
  <link rel="stylesheet" href="css/sss.css">
</head>
<body>
<body>

    <header class="site-header">
      <div class="container nav">
        <a href="index.html" class="logo">NeoPortfolio</a>
    
        <button class="hamburger" aria-expanded="false" aria-label="メニュー">
          ☰
        </button>
    
        <ul class="nav-menu" id="menu">
          <li><a href="character.html">キャラクター</a></li>
          <li><a href="self-introduction.html">自己紹介</a></li>
          <li><a href="trip.html">旅行</a></li>
          <li><a href="Awards.html">受賞歴</a></li>
          <li><a href="ind.html">ギリギリ・パーキング</a></li>
          <li><a href="../de.html">デザイン</a></li>
          <li><a href="../../index.html">オールトップ</a></li>
        </ul>
      </div>
    </header>
    
    <main class="section" style="margin-top:120px;">
      <div class="container">
    
        <div class="head">
          <h2>🎮 ギリギリ・パーキング</h2>
          <p>高速道路アクションゲーム</p>
        </div>
    
        <div class="game-area">
          
          <div id="game-board">
            <div id="goal"></div>
            <div id="car"></div>
    
            <div id="traffic-light">
              <div class="light red"></div>
              <div class="light yellow"></div>
              <div class="light green"></div>
            </div>
          </div>
    
          <div id="speed-meter">
            <div id="speed-bar"></div>
          </div>
    
          <div id="fuel-bar-container">
            <div id="fuel-bar"></div>
          </div>
    
          <div id="message"></div>
    
          <div id="info">
            🔥 連続成功: <span id="streak">0</span> |
            🏆 ハイスコア: <span id="highscore">0</span>
          </div>
    
          <div id="ranking">
            <h3>🏆 WORLD RANKING</h3>
            <ul id="ranking-list"></ul>
          </div>
    
          <button id="retry-btn">リトライ</button>
          <button id="mode-toggle">🌙 NIGHT</button>
    
        </div>
    
      </div>
    </main>
    
    <!-- 背景演出はそのまま -->
    <div class="city"></div>
    <div class="moon"></div>
    <div class="light-glow"></div>
    <div class="fog"></div>
    
    <div id="start-screen">
      <h1>🚗 GIRI-GIRI PARKING</h1>
      <button id="start-btn">START</button>
    </div>
    
    <audio id="engine-sound" src="engine.mp3" loop></audio>
    <audio id="success-sound" src="success.mp3"></audio>
    <audio id="fail-sound" src="fail.mp3"></audio>
    <section style="margin-top:120px;">

    
    <script src="js/hk.js"></script>
    <script>
    const hamburger = document.querySelector('.hamburger');
    const menu = document.querySelector('#menu');
    
    hamburger.addEventListener('click', () => {
      const expanded = hamburger.getAttribute('aria-expanded') === 'true';
      hamburger.setAttribute('aria-expanded', !expanded);
      menu.classList.toggle('open');
    });
    </script>
    
    
    </body>
    </html>
